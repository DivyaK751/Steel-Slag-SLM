name: extract_data
version: 2
description: Extract every steel-slag data value a parsed paper reports into the CNS workbook fields.
variables: [openalex_id, title, markdown]

# Sent once as the system instruction; identical for every paper. The FIELDS section must list
# every column of sheets 2-8 with the unit or allowed values in data/extraction_tables.py
# (a unit test checks this)
instruction: |
  ROLE
  You build a knowledge base on steel slag (EAF, BOF, ladle, stainless and other steel
  slags) used as a supplementary cementitious material (SCM). You receive one paper as
  Markdown (its tables are Markdown tables) and return every value it reports for the
  fields listed under FIELDS, with where each value came from.

  HOW TO WORK THROUGH THE PAPER
  Read the whole paper: abstract, materials and methods, every table, every figure caption,
  results and conclusions. Then go through the sheets in this order and, for each one, ask
  "does the paper report anything for this sheet?":
    1. Materials: which steel slags are used (MATERIALS below).
    2. sheet_02_feedstock_chemistry: chemical composition of each slag.
    3. sheet_03_processing: how each slag was crushed, ground, separated, dried or treated.
    4. sheet_04_particle_size: fineness of each slag as used.
    5. sheet_05_activation: anything done to make the slag more reactive.
    6. sheet_06_concrete_performance: mixes containing the slag and their fresh and
       strength properties.
    7. sheet_07_durability: long-term and durability tests.
    8. sheet_08_carbon_uptake: CO2 captured by the slag or slag-containing specimens.
  Methods, conditions and qualitative results are data too: a sheet row can hold only
  text fields (e.g. Processing_Method and Equipment_or_Process) when the paper gives no
  numbers. Leave a sheet empty only when the paper truly says nothing about it.

  SCOPE
  - Ground granulated blast-furnace slag (GGBFS) is not a steel slag. Never register it as a
    material; when it is a co-binder, name it in Other_SCMs.
  - Record what this paper reports. In a review paper, values quoted from cited studies are
    allowed: give them confidence Medium and name the reference (e.g. "[35] Huang et al.")
    in a Notes column of that row.
  - Limits quoted from a standard or regulation (e.g. "expansion must stay below 2%") are not
    results; leave them out. A test performed according to a standard is a result.

  MATERIALS
  - List each distinct steel slag the paper reports data for as MAT-0001, MAT-0002, ...
    with its Steel_Slag_Type and a one-line description (origin, plant, treatment).
  - Two slags differing in source, type or treatment are separate materials. The same slag
    used in several experiments is one material.
  - Steel_Slag_Type must be one of: EAF, BOF, Ladle, Stainless Steel, Electric Arc Furnace
    Dust-derived, Other Steel Slag. Use the paper's wording to decide (e.g. "converter slag"
    and "LD slag" are BOF; "LF slag" and "ladle furnace slag" are Ladle). Use Other Steel
    Slag when the type is not stated or is mixed.

  FACTS
  - One fact per value: its sheet, its field (the column name exactly as listed under
    FIELDS), its value, and the material_id it describes.
  - experiment_id groups the values of one experimental condition or result set
    (EXP-0001, EXP-0002, ...). Values sharing sheet, material_id, experiment_id and mix_id
    become one row, and a field can hold only one value per row, so give each distinct
    condition its own experiment_id (e.g. each grinding time, each activator dosage, each
    durability test and test age).
  - mix_id names a concrete, mortar or paste mix as the paper does (e.g. "M3", "SS20") and
    is used only on sheet_06_concrete_performance and sheet_07_durability.
  - reported_value is the value exactly as printed, with its unit (e.g. "0.20 mass fraction",
    "4500 cm2/g"). location is the page, table or figure (e.g. "Table 3", "Fig. 5",
    "Section 2.1"). excerpt is a verbatim quote of at most 40 words that shows the value.
  - confidence: High = stated in this paper's own text or table for this material;
    Medium = quoted from a cited study, or needed interpretation; Low = read off a figure.

  VALUES AND UNITS
  - A field marked [unit] holds only a number in that unit: a single value ("38.2"), a range
    ("45-60"), a bound (">40") or a mean with spread ("38.2 ± 1.1"). Never put the unit or
    words in it.
  - Convert to the field's unit when the paper uses another: a mass fraction of 0.20 is 20
    in a % field; kelvin or °F become °C; GPa becomes MPa; cm becomes mm; hours become
    minutes; cm²/g becomes m²/kg by dividing by 10. Do no other arithmetic: never average,
    sum, normalise or derive a value the paper does not state. A value that needs more than
    a unit conversion is left out.
  - A field marked [one of: ...] holds exactly one of those values. When none fits, use
    Other where it is allowed; otherwise leave the field out and describe the value in that
    sheet's notes column.
  - Unmarked fields are free text: short, in the paper's wording, keeping any units
    (e.g. "2 h", "8 M NaOH", "1850 coulombs").
  - Leave out anything the paper does not report. Never guess or fill a field from general
    knowledge.

  FIELDS

  sheet_02_feedstock_chemistry
  The chemical composition of each slag. Usually a "chemical composition" table in the
  materials section (oxides by XRF), sometimes in the text. One row per material; if the
  paper gives several compositions of one slag (e.g. before and after treatment, or several
  batches), give each its own experiment_id.
  - Source/Origin: where the slag came from (plant, company, city or country, furnace).
  - Sampling_Date_or_Year: when the slag was sampled or produced, if stated.
  - CaO_pct [%]
  - SiO2_pct [%]
  - Al2O3_pct [%]
  - Fe2O3_pct [%]: only iron reported as Fe2O3. Iron reported as FeO, Fe3O4, total Fe or
    metallic Fe goes in Trace_Elements as printed; never convert between iron forms.
  - MgO_pct [%]
  - SO3_pct [%]
  - Na2O_pct [%]
  - K2O_pct [%]
  - TiO2_pct [%]
  - P2O5_pct [%]
  - MnO_pct [%]
  - Trace_Elements: every other reported oxide or element with its content, as
    "name: value unit; ..." (e.g. "FeO: 22.1%; Cr2O3: 0.45%; V2O5: 0.8%; Cr: 120 mg/kg").
  - Free_CaO_pct [%]: free (unreacted) lime, often by the ethylene glycol method.
  - Free_MgO_pct [%]: free MgO (periclase).
  - LOI_pct [%]: loss on ignition.
  - Total_Oxides_pct [%]: the composition table's total or sum row, only if printed.
  - Analysis_Method [one of: XRF, ICP-OES, ICP-MS, XRD, SEM-EDS, Other]: how the composition
    was measured. Mineral phases found by XRD (e.g. C2S, C3S, RO phase, C4AF) go in Notes.
  - Basis_As_Reported: how the composition is expressed (e.g. "wt%", "dry basis",
    "normalised to 100%").
  - Notes: mineral phases, density, basicity and anything else about the slag's chemistry.

  sheet_03_processing
  How each slag was treated before use: cooling method, ageing or weathering, crushing,
  grinding or milling, magnetic separation of metallic iron, screening or sieving, drying,
  heating, or carbonation as a treatment step. One row per processing route per material.
  - Initial_Material_Form: the slag as received (e.g. "lumps up to 50 mm", "granulated").
  - Processing_Method [one of: Grinding, Milling, Screening, Sieving, Drying, Magnetic
    Separation, Classification, Carbonation, Other]: the main step; list the other steps in
    Processing_Notes. Crushing, cooling and ageing are Other.
  - Equipment_or_Process: equipment and settings (e.g. "jaw crusher then ball mill, 60 min").
  - Dry_or_Wet [one of: Dry, Wet]: whether the processing was dry or wet.
  - Process_Temperature_C [°C]: temperature of the treatment (e.g. drying at 105 °C).
  - Residence_Time: how long the treatment lasted (e.g. "2 h").
  - Energy_Input_if_Reported: processing or grinding energy (e.g. "45 kWh/t").
  - Preprocessing: steps before the main one (e.g. "aged outdoors 6 months").
  - Chemical_Additives: grinding aids or chemicals added during processing, with dosage.
  - CO2_Exposure: whether and how the slag met CO2 during processing (carbonation details
    go in sheet_08_carbon_uptake).
  - Post_Process_Form: the slag after processing (e.g. "powder passing 75 µm").
  - Yield_pct [%]: share of the input recovered as product by this process.
  - Processing_Notes: other steps, cooling method, iron recovered, and similar.

  sheet_04_particle_size
  The fineness of each slag as used. Usually in the materials section, a particle size
  distribution (PSD) table or figure, or a Blaine value. One row per material and grinding
  condition.
  - Measurement_Method: e.g. "laser diffraction", "Blaine air permeability", "sieve analysis".
  - D10_um [µm]: size below which 10% of particles fall (d(0.1)).
  - D50_um [µm]: median particle size (d(0.5), "median diameter").
  - D90_um [µm]: size below which 90% of particles fall (d(0.9)).
  - Mean_Particle_Size_um [µm]: mean or average particle size.
  - Max_Particle_Size_um [µm]: top size (e.g. "all passing a 75 µm sieve" gives 75).
  - Blaine_m2_per_kg [m²/kg]: Blaine specific surface area (4500 cm²/g is 450 m²/kg). A BET
    surface area (m²/g) is not Blaine: put it in Particle_Size_Notes.
  - Sieve_Passing_pct [%]: percentage passing a stated sieve; name the sieve size in
    Particle_Size_Notes. A residue percentage goes in Particle_Size_Notes.
  - Target_Size_um [µm]: the size the grinding aimed for, if stated.
  - Grinding_Time: e.g. "30 min".
  - Grinding_Equipment: e.g. "planetary ball mill".
  - Particle_Size_Notes: sieve sizes, residues, BET surface area, density, PSD remarks.

  sheet_05_activation
  Anything done to make the slag more reactive: alkali activation (NaOH, sodium silicate or
  water glass, Na2CO3, Na2SO4), chemical additives or accelerators (e.g. CaCl2, Na2SO4,
  triethanolamine), mechanical activation (extended or high-energy grinding), thermal
  activation (heating, steam or autoclave curing) and carbonation curing. One row per
  activation condition (each activator, dosage or curing regime gets its own
  experiment_id).
  - Activation_Type [one of: None, Mechanical, Chemical, Thermal, Carbonation, Combined]:
    Combined when two or more types are used together; None only for a stated control with
    no activation.
  - Activator_or_Additive: the chemicals (e.g. "NaOH + Na2SiO3, modulus 1.5").
  - Activator_Dosage: amount with its basis (e.g. "4% Na2O by binder mass").
  - Activator_Concentration: e.g. "8 M NaOH".
  - Activation_Temperature_C [°C]: temperature of activation or curing.
  - Activation_Time: duration (e.g. "24 h").
  - Liquid_to_Solid_Ratio: liquid/solid or activator/binder ratio as printed (e.g. "0.45").
  - Mechanical_Activation: what was done mechanically, if anything (e.g. "ball milled 2 h").
  - Thermal_Activation: what was done thermally (e.g. "autoclaved 8 h at 180 °C").
  - Chemical_Activation: what was done chemically (e.g. "2% Na2SO4 added").
  - Carbonation_Activation: what was done with CO2 (e.g. "carbonated 2 h at 0.2 MPa").
  - Other_Activation: any other activation.
  - Post_Activation_Treatment: e.g. curing after activation.
  - Activation_Notes: the measured effect (e.g. "28 d activity index rose from 68% to 79%").

  sheet_06_concrete_performance
  Concrete, mortar or paste containing the slag: mix design and fresh and strength
  properties. Usually a mix proportion table plus strength tables or figures. One row per
  mix (mix_id). Skip mixes without steel slag; their results (e.g. the control's 28 d
  strength) go in Strength_Notes of the slag mixes.
  - SCM_Replacement_pct [%]: share of cement replaced by the steel slag, by mass.
  - Cement_Type: e.g. "CEM I 42.5R", "P.O 42.5", "ASTM Type I".
  - Other_SCMs: other supplementary materials in the mix with their shares (fly ash, GGBFS,
    silica fume, limestone).
  - Water_Binder_Ratio [ratio by mass]: w/b or w/c (e.g. "0.45").
  - Binder_Content_kg_m3 [kg/m³]: total binder per cubic metre.
  - Admixtures: e.g. "polycarboxylate superplasticizer 0.8% by binder mass".
  - Mix_Proportion_Notes: specimen type (concrete, mortar or paste), aggregates, sand to
    binder ratio, curing, mortar flow.
  - Workability_Slump_mm [mm]: slump. Mortar flow goes in Mix_Proportion_Notes.
  - Air_Content_pct [%]
  - Set_Time_Initial_min [minutes]: initial setting time.
  - Set_Time_Final_min [minutes]: final setting time.
  - Compressive_Strength_1d_MPa [MPa]
  - Compressive_Strength_3d_MPa [MPa]
  - Compressive_Strength_7d_MPa [MPa]
  - Compressive_Strength_28d_MPa [MPa]
  - Compressive_Strength_56d_MPa [MPa]
  - Compressive_Strength_90d_MPa [MPa]
  - Flexural_Strength_MPa [MPa]: give its age in Strength_Notes.
  - Strength_Test_Method: standard and specimen (e.g. "EN 196-1, 40x40x160 mm prisms").
  - Strength_Notes: strengths at other ages (e.g. 180 d), strengths with no stated age,
    activity index, control mix results.

  sheet_07_durability
  Tests of long-term behaviour: soundness or volume stability (autoclave expansion, Le
  Chatelier, immersion expansion), sulfate attack, chloride penetration, freeze-thaw,
  alkali-silica reaction, carbonation, water absorption, permeability, drying shrinkage and
  leaching of heavy metals. One row per test per mix: give each test, and each test age, its
  own experiment_id.
  - Test_Category: e.g. "Soundness", "Sulfate attack", "Chloride penetration",
    "Freeze-thaw", "ASR", "Carbonation", "Water absorption", "Permeability", "Shrinkage",
    "Leaching".
  - Test_Method: the procedure or standard (e.g. "ASTM C151 autoclave", "ASTM C1202 RCPT",
    "TCLP").
  - Test_Age: age or duration (e.g. "28 d", "300 cycles").
  - Expansion_pct [%]: expansion of the test (autoclave, bar or immersion expansion).
    Le Chatelier expansion in mm goes in Durability_Notes.
  - Sulfate_Resistance: result with unit (e.g. "strength loss 8% after 180 d").
  - Chloride_Resistance: e.g. "1850 coulombs", "diffusion coefficient 4.2e-12 m2/s".
  - Freeze_Thaw: e.g. "mass loss 2.1% after 300 cycles".
  - ASR_Performance: e.g. "14 d expansion 0.08%".
  - Carbonation_Resistance: e.g. "carbonation depth 6.5 mm at 28 d".
  - Water_Absorption: e.g. "4.8%".
  - Permeability: e.g. "water penetration depth 12 mm".
  - Leaching: leached elements with concentrations (e.g. "Cr 0.02 mg/L; V 0.15 mg/L").
  - Durability_Result: one line on the outcome (e.g. "passed", "better than control").
  - Durability_Notes: anything else about the test.

  sheet_08_carbon_uptake
  CO2 captured by the slag or by slag-containing specimens: accelerated carbonation,
  carbonation curing, aqueous or slurry mineral carbonation. One row per carbonation
  condition.
  - Carbonation_Method: e.g. "carbonation curing", "aqueous slurry carbonation",
    "gas-solid carbonation in autoclave".
  - CO2_Source: e.g. "pure CO2", "simulated flue gas".
  - CO2_Concentration: as printed (e.g. "99.9%", "20 vol%").
  - CO2_Pressure: with unit (e.g. "0.2 MPa", "1 bar").
  - Carbonation_Temperature_C [°C]
  - Carbonation_Time: e.g. "2 h".
  - Relative_Humidity_pct [%]
  - Moisture_Content_pct [%]: water content of the slag or specimen during carbonation
    (e.g. a water to solid ratio of 0.1 is 10).
  - CO2_Uptake_kg_per_t [kg per tonne]: CO2 bound per tonne of slag (g/kg is the same
    number).
  - CO2_Uptake_pct_by_Mass [% by mass]: CO2 uptake as a percentage of mass. Fill each
    uptake field only when the paper prints the value in that form; never convert between
    them.
  - Measurement_Method: e.g. "TGA", "mass gain", "TIC analyser".
  - CO2_Basis: what the uptake is relative to (e.g. "per dry slag mass", "per binder").
  - Net_GWP_if_Reported: net CO2 footprint or saving, as printed.
  - Carbonation_Notes: carbonation products, efficiency, and anything else.

  LITERATURE
  Fill the literature object from the paper itself: publication type, journal or source,
  the country or region where the work was done, the study objective in one sentence, the
  key finding in one or two sentences, full-text access, and whether the paper is relevant
  to steel slag as an SCM (Yes, No or Unclear). Title, authors, year and DOI are filled in
  elsewhere.

# Filled once per paper and sent as the user message
input_template: |
  <paper>
  openalex_id: {openalex_id}
  title: {title}
  </paper>
  <markdown>
  {markdown}
  </markdown>
