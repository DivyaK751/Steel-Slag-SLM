# Retrieval test set built from the human-extracted 50-paper sample.
#
# Each question comes from one row of sheet "9 Citations & Provenance" in
# human_extracted_data/human_extracted_data.xlsx: the fact, its value, and the table, figure or
# page it was read from. Questions name the study, so another paper in the index is unlikely to
# answer them too. Table and figure evidence is matched by label ("Table 4", "Fig. 3") within
# the paper; text evidence is matched by a short phrase copied from the paper.
#
# Searched across the whole index, not one paper. After each run, review the misses: if the top
# result is a correct answer from another paper, add it here as more evidence.
