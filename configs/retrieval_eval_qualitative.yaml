# Retrieval test set of questions only the papers can answer.
#
# The extraction tables hold values (oxides, strengths, uptakes), so questions about mechanisms,
# mineral phases, hydration products, observations and the authors' recommendations always reach
# search. Written answer-first from the parsed text of the 50-paper sample: each answer is a
# phrase copied from the sentence that states it, and the question is worded differently. A
# chunk of the paper containing the phrase counts as reaching the answer.
depth: 20
# The papers searched: these test papers plus 100 random parsed papers as distractors
corpus: retrieval_corpus_tuning.txt
