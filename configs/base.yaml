fetch:
  # Each query is paged through separately and resumes where the last run stopped
  queries:
    # Quoted phrases keep OpenAlex from matching "steel" and "slag" separately
    - '"steel slag" cement'
    - '"steel slag" concrete'
    - '"steel slag" binder'
    - '"steel slag" hydration'
    - '"steel slag" carbonation'
    - '"steel slag" CO2 sequestration'
    - '"steel slag" characterization'
    - '"steelmaking slag"'
    - '"BOF slag"'
    - '"EAF slag"'
    - '"ladle slag"'
    # Slag-type synonyms (Europe/India say LD; US says "steel furnace slag")
    - '"electric arc furnace slag"'
    - '"basic oxygen furnace slag"'
    - '"ladle furnace slag"'
    - '"LMF slag"'
    - '"LD slag"'
    - '"BOS slag"'
    - '"converter slag"'
    - '"stainless steel slag"'
    - '"AOD slag"'
    - '"steel furnace slag"'
    # Use cases and processing routes from the Project Overview
    - '"steel slag" supplementary cementitious'
    - '"steel slag" pozzolanic'
    - '"steel slag" alkali-activated'
    - '"steel slag" geopolymer'
    - '"steel slag" mineral carbonation'
    - '"steel slag" "CO2 uptake"'
    - '"steel slag" grinding'
    - '"steel slag" "mechanical activation"'
    - '"steel slag" "volume stability"'
    - '"steel slag" expansion'
    - '"steel slag" "free lime"'
    - '"steel slag" "compressive strength"'
    - '"steel slag" durability'
    - '"steel slag" reactivity'
    - '"induction furnace slag"'
    - '"steel slag" "clinker production"'
    - '"steel slag" "iron reclamation"'
    - '"steel slag aggregate"'
    - '"artificial aggregate" "steel slag"'
    - '"steel slag" "early-age hydration"'
    - '"steel slag binder"'
    - '"alkaline industrial wastes" carbonation'
    - '"high performance cementing materials" slag'
    # Slag names the relevance rules accept but no search asked for
    - '"white slag"'
    - '"black slag"'
    - '"LF slag"'
    - '"electric furnace slag"'
    - '"ladle metallurgy slag"'
    - '"secondary metallurgy slag"'
    - '"dephosphorization slag"'
    - '"argon oxygen decarburization slag"'
    # Names common in Chinese papers, a large share of this literature
    - '"steel slag powder"'
    - '"steel slag micropowder"'
    - '"converter steel slag"'
    - '"desulfurization slag"'  # KR hot-metal desulfurization slag
    - '"steel slag" "composite cement"'
    - '"steel slag" "cementitious material"'
    # Processing, activation and carbon uptake routes (workbook tabs 3, 5 and 8)
    - '"steel slag" "carbonation curing"'
    - '"steel slag" "CO2 curing"'
    - '"steel slag" "accelerated carbonation"'
    - '"steel slag" "activity index"'
    - '"steel slag" "thermal activation"'
    - '"steel slag" "chemical activation"'
    - '"steel slag" "supersulfated"'
    - '"steel slag" phosphogypsum'
    - '"steel slag" "hot stage"'  # hot-state / molten modification
    - '"steel slag" "reconstruction"'  # Chinese term for molten modification
    - '"steel slag" "water quenched"'
    - '"steel slag" "air cooled"'
    - '"steel slag" "belite"'
    - '"steel slag" "raw meal"'
    - '"steel slag" autoclave'
    - '"steel slag" "ternary"'
  search_filter: "is_oa:true,language:en"
  # Citation sort surfaces famous off-topic papers; relevance keeps results on steel slag
  sort: "relevance_score:desc"
  per_page: 200
  # Each time the download queue runs dry, every search reads this many more result pages
  pages_per_discovery: 5
  request_timeout_s: 30
  # Stop before a paid download once the remaining daily budget drops below this
  min_budget_usd: 0.011

# Rules distilled from the team's "Feedback on papers" review.
# All matching is case-insensitive, with hyphens treated as spaces.
relevance:
  # Title or abstract must mention a steel slag (not just "slag"). Terms match as substrings,
  # so "steel slag" also covers "steel slags" and "stainless steel slag"
  slag_terms:
    - steel slag
    - steelmaking slag
    - steel making slag  # "steel-making slag" after hyphens become spaces
    - basic oxygen steelmaking slag
    - eaf slag
    - eafs
    - bof slag
    - bofs
    - ld slag
    - bos slag
    - converter slag
    - electric arc furnace slag
    - electric furnace slag
    - basic oxygen furnace slag
    - steel furnace slag
    - ladle slag
    - ladle furnace slag
    - lf slag
    - lmf slag
    - ladle metallurgy slag
    - secondary metallurgy slag
    - white slag  # reducing ladle slag
    - black slag  # oxidizing EAF slag
    - aod slag
    - argon oxygen decarburization slag
    - dephosphorization slag
    - desulfurization slag
    - desulphurization slag
    - induction furnace slag
  # Title or abstract must touch a use case we extract (cementitious, stability or CO2) ...
  # "cement" also covers cementitious/SCM wording, "pozzolan" covers pozzolanic/pozzolana,
  # "co2" covers CO2 uptake, "carbonation" covers mineral carbonation
  include_terms:
    - cement
    - concrete
    - mortar
    - binder
    - clinker
    - pozzolan
    - puzzolan  # older spelling
    - hydration
    - hydraulic
    - alkali activated
    - geopolymer
    - grinding
    - compressive strength
    - setting time
    - volume stability
    - soundness
    - expansion
    - free lime
    - f cao  # "f-CaO" after hyphens become spaces
    - free mgo
    - carbonation
    - co2
    - sequestration
    - carbon capture
    # Processing and activation routes; the paper must still name a steel slag
    - activity index
    - thermal activation
    - chemical activation
    - supersulfated
    - supersulphated
    - phosphogypsum
    - belite
    - raw meal
    - autoclave
    - ternary
    - hot stage
    - quench  # also water-quenched, quenching
    - air cooled  # "air-cooled" after hyphens become spaces
    - reconstruction
  # ... or the title must signal a characterization or utilization study. These words are
  # title-only because nearly every abstract says "utilization" or "characterization".
  include_title_terms:
    - mineralogy
    - mineralogical
    - mineral phases
    - phase composition
    - characterization
    - characterisation
    - chemical composition
    - microstructure
    - reactivity
    - pretreatment
    - modification
    - utilization
    - utilisation
    - valorization
    - valorisation
    - recycling
    - reuse
    - mayenite  # high-Al ladle slag phase
    - belite
    - dicalcium silicate
    - c2s
    - ro phase
    - wustite
    - periclase
  # A title containing any of these is skipped (off-topic uses of steel slag)
  exclude_title_terms:
    - asphalt
    - bitumen
    - bituminous
    - soil
    - subgrade
    - road base
    - base course
    - railway ballast
    - groundwater
    - geochemical
    - slag heap
    - fertilizer
    - fertiliser
    - phosphate removal
    - phosphorus removal
    - adsorption
    - adsorbent
    - wastewater
    - heavy metal removal
    - acid mine drainage
    - catalyst
    - agricultur
    - ceramic  # also glass-ceramic
    - tile
    - sintered
    - pavement
    - microwave
    - freshwater
    - aquatic
    - phytoplankton
    - sediment
  # Other slags skip a title only when it names no steel slag, so blends such as
  # "steel slag-GGBFS-cement" stay in
  other_slag_title_terms:
    - blast furnace
    - ggbfs
    - ggbs
    - copper slag
    - nickel slag
    - ferronickel
    - ferrochrome
    - silicomanganese
    - lead slag
    - zinc slag
    - titanium slag
    - phosphorus slag
    - incineration

drive:
  # Move "No" papers here instead of deleting them, so the job never re-downloads them
  rejected_subfolder_name: Rejected
  # Papers with no downloadable PDF are listed here so daily runs stop retrying them
  no_pdf_list_name: _fetcher_no_pdf_ids.txt
  # Relevant papers found by the searches but not downloaded yet
  queue_list_name: _fetcher_queue_ids.txt
  # The next result page each search reads, so runs go deeper instead of repeating page 1
  search_progress_name: _fetcher_search_progress.txt
  # The date searching last found nothing new; later runs that day skip searching
  no_new_papers_name: _fetcher_no_new_papers_date.txt

registry:
  # One row per paper in the Drive folder, with its abstract, keywords and language
  dataset: steel_slag
  table: papers
  location: US

pdf_parsing:
  source_table: capstone-project-511200.steel_slag.screening_evaluation
  output_folder_name: _parsed
  index_file_name: index.json

# Defaults shared by every Gemini agent; an agent's own section can override any of them
llm:
  model: gemini-3.8-flash
  # Screening and extraction should give the same answer twice for the same paper
  temperature: 0.0

screening:
  prompt_name: screen_relevance
  model: null  # null = use llm.model
  # Rows read from BigQuery and written back per round trip
  batch_size: 50
  # Gemini calls in flight at once; raise slowly, Vertex quotas are per minute
  max_concurrency: 8

abstract_extraction:
  prompt_name: extract_abstract
  model: null  # null = use llm.model
  # Only the first pages are sent; abstracts sit on page 1 or 2
  max_pages: 3
  # Papers read from BigQuery, downloaded from Drive and written back per round trip
  batch_size: 10
  # Gemini calls in flight at once; at 4, Vertex kept making calls wait and retry
  max_concurrency: 2
  # A call taking longer is given up and retried on the next run, so it can't stall a batch
  call_timeout_s: 120

evaluation:
  # Human-labelled papers; lives in the same project and dataset as the papers table
  table: screening_evaluation
  # One Excel report per run, git-ignored
  output_dir: reports/evaluation

embedding:
  # Local sentence-transformers model; its vectors are only comparable with the same model
  model: BAAI/bge-small-en-v1.5
  # bge models expect this text in front of search queries (not in front of passages)
  query_prefix: "Represent this sentence for searching relevant passages: "
  # Text chunks are packed from paragraphs up to this many characters
  chunk_max_chars: 800
  # A table longer than this is split into row groups, each repeating the header
  table_max_chars: 1500
  # The index is saved to Drive after this many papers, so a failed run loses little work
  papers_per_save: 25
  top_k: 5

figure_extraction:
  # Local output for now (git-ignored): one folder per paper with PNGs and figures.json
  output_dir: data/interim/figures
  # Crops are re-rendered from the page, so vector plots come out sharp at any size
  render_dpi: 200
  # A caption counts as a figure's own when it is within this distance below, beside or above it
  caption_max_gap_pt: 60
  # Regions narrower or shorter than this (1 inch) are logos, icons or rules, not figures
  min_side_pt: 72
  # A region holding a caption is split there only if both parts are at least this tall
  min_split_height_pt: 50
  # Docling classifier labels that are never figures worth keeping
  drop_types: [logo, icon, signature, stamp, qr_code, bar_code]
  # Uncaptioned regions are kept only this large (some papers print the caption inside the
  # image); smaller ones are author photos, ads and journal artwork
  min_uncaptioned_side_pt: 150

figure_reading:
  prompt_name: read_figure
  model: null  # null = use llm.model
  # Reading a chart needs little reasoning, and thinking tokens were half the cost at default
  thinking_level: low
  # Gemini calls in flight at once; raise slowly, Vertex quotas are per minute
  max_concurrency: 4
  # A call taking longer is skipped and reported, so it can't stall the run
  call_timeout_s: 120
  # Vertex AI price of llm.model per million tokens, for the run's cost report. Gemini Flash
  # is on an introductory $0.75 / $3.75 until 2026-12-31, then $1.50 / $7.50; re-check it
  prices:
    input_usd_per_million: 0.75
    output_usd_per_million: 3.75
