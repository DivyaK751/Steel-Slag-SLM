# Built like retrieval_eval_human50.yaml, from rows of sheet "9 Citations & Provenance" in
# human_extracted_data/human_extracted_data.xlsx, but only from facts that set does not use:
# other tables, figures and values of the same papers. If a setup scores far lower here than on
# the tuning set, its gains came from fitting those questions.
