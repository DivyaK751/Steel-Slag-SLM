# Fixed retrieval test set for evaluate-retrieval.
#
# Each question lists every passage known to answer it. A retrieved chunk counts when it comes
# from the same paper and chunk kind and contains the evidence text (case and spacing ignored),
# so these labels survive index rebuilds. grade 2 = states the answer; grade 1 = partial or
# supporting (a table pointer, a related mechanism, a partial value).
#
# Status: DRAFT. Labels were drafted from the 46 papers indexed on 2026-10-23 by pooling each
# question's top 10 embedding results with keyword matches, then reading them. They need review
# by someone who knows the papers before the scores are treated as reliable. Passages that the
# pool did not surface may be missing, which makes recall look lower than it is.
