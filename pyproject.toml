[project]
name = "steel-slag-slm"
version = "0.1.0"
description = "Steel slag literature pipeline and small language model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.5.0",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.scripts]
fetch-papers = "steel_slag_slm.cli:fetch_papers"

[dependency-groups]
dev = ["mypy>=1.8", "pytest>=8.0", "ruff>=0.4", "types-pyyaml", "types-requests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
ignore_missing_imports = true
# google-auth ships without type hints
untyped_calls_exclude = ["google"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: touches real external services (skipped by default)"]
addopts = "-m 'not integration'"
