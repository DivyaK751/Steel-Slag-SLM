[project]
name = "steel-slag-slm"
version = "0.1.0"
description = "Steel slag literature pipeline and small language model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.140.0",
    "google-adk>=2.12.0",
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.5.0",
    "google-cloud-bigquery>=3.46.2",
    "openpyxl>=3.1.5",
    "pydantic>=2.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.scripts]
fetch-papers = "steel_slag_slm.cli:fetch_papers"
sync-registry = "steel_slag_slm.cli:sync_registry"
fill-abstracts = "steel_slag_slm.cli:fill_abstracts"
screen-papers = "steel_slag_slm.cli:screen_papers"
evaluate-screening = "steel_slag_slm.cli:evaluate_screening"
parse-pdfs = "steel_slag_slm.cli:parse_pdfs"

[dependency-groups]
dev = [
    "mypy>=1.8",
    "pytest>=8.0",
    "ruff>=0.4",
    "types-openpyxl>=3.1.5.20260827",
    "types-pyyaml",
    "types-requests",
]
notebook = [
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
ignore_missing_imports = true
# google-auth ships without type hints
untyped_calls_exclude = ["google", "pymupdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: touches real external services (skipped by default)"]
addopts = "-m 'not integration'"
