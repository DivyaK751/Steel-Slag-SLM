name: Fill missing abstracts

# Runs nightly as the last step of "Fetch papers", and can also be started by hand
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      max_papers:
        description: "Stop after trying this many papers (blank = every paper missing an abstract)"
        required: false
        type: string

env:
  DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
  GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
  GOOGLE_CLOUD_LOCATION: global
  GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

jobs:
  fill-abstracts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Write Google credentials
        run: .github/scripts/write_google_credentials.sh
      - name: Extract missing abstracts from each paper's first pages
        run: |
          if [ -z "$GOOGLE_CLOUD_PROJECT" ] || [ -z "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_CLOUD_PROJECT or GCP_SERVICE_ACCOUNT_JSON secret not set; skipping."
            exit 0
          fi
          uv run fill-abstracts ${MAX_PAPERS:+--max-papers "$MAX_PAPERS"}
        env:
          MAX_PAPERS: ${{ inputs.max_papers }}
