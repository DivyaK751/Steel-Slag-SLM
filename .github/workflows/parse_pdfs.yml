name: Parse trial PDFs

on:
  workflow_dispatch:
    inputs:
      max_papers:
        description: "Maximum unindexed papers to parse; blank means all"
        required: false
        default: "1"
        type: string
      paper_ids:
        description: "OpenAlex IDs to parse, space-separated (e.g. W123 W456); max_papers still applies"
        required: false
        default: ""
        type: string
      follow_up_runs:
        description: "Automatic follow-up runs (0 = off; maximum 12)"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: parse-trial-pdfs
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      follow_up_runs: ${{ steps.parse.outputs.follow_up_runs }}
    env:
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_CLOUD_LOCATION: global
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Check required secrets
        run: |
          if [ -z "$DRIVE_FOLDER_ID" ]; then
            echo "DRIVE_FOLDER_ID secret is required."
            exit 1
          fi
          if [ -z "$GOOGLE_OAUTH_TOKEN_JSON" ] && [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Configure GOOGLE_OAUTH_TOKEN_JSON or GOOGLE_SERVICE_ACCOUNT_JSON for Drive."
            exit 1
          fi
          if [ -z "$GOOGLE_CLOUD_PROJECT" ] || [ -z "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_CLOUD_PROJECT and GCP_SERVICE_ACCOUNT_JSON are required for BigQuery."
            exit 1
          fi

      - name: Write Google credentials
        run: .github/scripts/write_google_credentials.sh

      - name: Install project dependencies
        run: uv sync --locked

      - name: Cache Docling models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: docling-pdf-parsing-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Parse PDFs into Drive v3
        id: parse
        env:
          MAX_PAPERS: ${{ inputs.max_papers }}
          PAPER_IDS: ${{ inputs.paper_ids }}
          FOLLOW_UP_RUNS: ${{ inputs.follow_up_runs }}
        run: bash .github/scripts/parse_pdf_batch.sh

  continue:
    needs: parse
    if: >-
      ${{ !cancelled() && github.run_attempt == 1 && needs.parse.result == 'success'
          && needs.parse.outputs.follow_up_runs != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the next batch
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_PAPERS: ${{ inputs.max_papers }}
          PAPER_IDS: ${{ inputs.paper_ids }}
          FOLLOW_UP_RUNS: ${{ needs.parse.outputs.follow_up_runs }}
        run: |
          set -euo pipefail
          gh workflow run parse_pdfs.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f "max_papers=$MAX_PAPERS" -f "paper_ids=$PAPER_IDS" \
            -f "follow_up_runs=$FOLLOW_UP_RUNS"
