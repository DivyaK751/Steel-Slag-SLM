name: Parse trial PDFs

on:
  workflow_dispatch:
    inputs:
      max_papers:
        description: "Maximum unindexed papers to parse; blank means all"
        required: false
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: parse-trial-pdfs
  cancel-in-progress: false

env:
  DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
  GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
  GOOGLE_CLOUD_LOCATION: global
  GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Check required secrets
        run: |
          if [ -z "$DRIVE_FOLDER_ID" ]; then
            echo "DRIVE_FOLDER_ID secret is required."
            exit 1
          fi
          if [ -z "$GOOGLE_OAUTH_TOKEN_JSON" ] && [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Configure GOOGLE_OAUTH_TOKEN_JSON or GOOGLE_SERVICE_ACCOUNT_JSON for Drive."
            exit 1
          fi
          if [ -z "$GOOGLE_CLOUD_PROJECT" ] || [ -z "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_CLOUD_PROJECT and GCP_SERVICE_ACCOUNT_JSON are required for BigQuery."
            exit 1
          fi

      - name: Write Google credentials
        run: .github/scripts/write_google_credentials.sh

      - name: Install project dependencies
        run: uv sync --locked

      - name: Parse PDFs
        env:
          MAX_PAPERS: ${{ inputs.max_papers }}
        run: |
          if [ -n "$MAX_PAPERS" ]; then
            uv run parse-pdfs --max-papers "$MAX_PAPERS"
          else
            uv run parse-pdfs
          fi

      # Keeps the embedding model between runs so each run doesn't download it again
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: embedding-model-bge-small-en-v1.5

      # Embeds the papers parsed above (and any others still unindexed) into the Drive index
      - name: Build search index
        run: uv run build-index
