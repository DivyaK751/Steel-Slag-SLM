name: Update search index

# Keeps the search index in step with the parsed papers: each run re-chunks only papers whose
# parsed.json changed in Drive and re-embeds only those whose chunks differ, so a run with no
# changes finishes in a few minutes. Also runnable by hand from the Actions tab.
on:
  schedule:
    - cron: "0 7 * * *"  # daily, 07:00 UTC
  workflow_dispatch:
    inputs:
      parsed_folder:
        description: "Parsed Drive folder to index"
        required: false
        default: "_parsed_approved"
        type: string

permissions:
  contents: read

concurrency:
  group: update-search-index
  cancel-in-progress: false

env:
  DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
  GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  PARSED_FOLDER: ${{ inputs.parsed_folder || '_parsed_approved' }}

jobs:
  build-index:
    runs-on: ubuntu-latest
    # The first run after a chunking change re-chunks every paper once
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Check required secrets
        run: |
          if [ -z "$DRIVE_FOLDER_ID" ]; then
            echo "DRIVE_FOLDER_ID secret is required."
            exit 1
          fi
          if [ -z "$GOOGLE_OAUTH_TOKEN_JSON" ] && [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Configure GOOGLE_OAUTH_TOKEN_JSON or GOOGLE_SERVICE_ACCOUNT_JSON for Drive."
            exit 1
          fi

      - name: Write Google credentials
        run: .github/scripts/write_google_credentials.sh

      - name: Install project dependencies
        run: uv sync --locked

      # Keeps the embedding model between runs so each run doesn't download it again
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: embedding-model-bge-small-en-v1.5

      - name: Update the index
        run: uv run build-index --parsed-folder "$PARSED_FOLDER"
