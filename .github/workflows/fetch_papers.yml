name: Fetch papers

on:
  schedule:
    - cron: "15 0 * * *"  # 00:15 UTC, just after OpenAlex resets daily budgets
  workflow_dispatch:
    inputs:
      max_papers:
        description: "Stop each member's run after this many papers (blank = until budget is used)"
        required: false

env:
  OPENALEX_CONTACT_EMAIL: ${{ secrets.OPENALEX_CONTACT_EMAIL }}
  DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
  GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
  GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

jobs:
  # Adds BigQuery rows for Drive papers that lack one: every paper on the first run,
  # then only papers a fetch run missed. Runs first, while the OpenAlex budget is fresh.
  sync-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Looking up a few hundred papers costs well under a cent of this member's budget
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY_DIVYA }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Write Google credentials
        run: .github/scripts/write_google_credentials.sh
      - name: Add missing papers to the BigQuery registry
        run: |
          if [ -z "$GOOGLE_CLOUD_PROJECT" ] || [ -z "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_CLOUD_PROJECT or GCP_SERVICE_ACCOUNT_JSON secret not set; skipping."
            exit 0
          fi
          uv run sync-registry

  fetch:
    needs: sync-registry
    # A failed registry sync shouldn't stop new papers from being fetched
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # Members run one after another, so each run sees the previous run's uploads in Drive
      max-parallel: 1
      fail-fast: false
      matrix:
        # Each name reads the secret OPENALEX_API_KEY_<NAME>
        member: [YASSINE, DIVYA, LAKSHYA, ANISHA, KANE]
    env:
      OPENALEX_API_KEY: ${{ secrets[format('OPENALEX_API_KEY_{0}', matrix.member)] }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Write Google credentials
        run: .github/scripts/write_google_credentials.sh
      - name: Fetch papers with member ${{ matrix.member }}'s key
        run: |
          if [ -z "$OPENALEX_API_KEY" ]; then
            echo "No OPENALEX_API_KEY_${{ matrix.member }} secret set; skipping."
            exit 0
          fi
          uv run fetch-papers ${MAX_PAPERS:+--max-papers "$MAX_PAPERS"}
        env:
          MAX_PAPERS: ${{ inputs.max_papers }}
